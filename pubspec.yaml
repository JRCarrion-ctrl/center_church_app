name: ccf_app
description: "This app was created for the purposes of the Center Church Frederick / Centro Cristiano Frederick to connect with their community, stay up to date on church events, and access church resources."

publish_to: 'none'

version: 1.2.6+14

environment:
  sdk: ^3.9.2

dependencies:
  # --- Flutter Core & SDK ---
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # --- State Management & Architecture ---
  flutter_riverpod: ^3.2.1
  provider: ^6.1.5+1

  # --- Routing & Deep Linking ---
  app_links: ^6.4.0
  go_router: ^17.1.0
  url_launcher: ^6.3.2

  # --- Networking & API ---
  dio: ^5.9.0
  graphql_flutter: ^5.2.1
  gql: ^1.0.1
  http: ^1.6.0

  # --- Authentication & Security ---
  flutter_appauth: ^11.0.0
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^5.0.1
  jwt_decoder: ^2.0.1
  openid_client: ^0.4.9+2

  # --- Local Storage & Preferences ---
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2

  # --- Localization, Date & Utilities ---
  easy_localization: ^3.0.8
  intl: ^0.20.0
  logger: ^2.6.2
  uuid: ^4.5.2
  web: ^1.1.1

  # --- UI, Icons & Theming ---
  cached_network_image: ^3.4.1
  cupertino_ui: ^1.1.6
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  font_awesome_flutter: ^11.0.0
  material_ui: ^1.11.0
  qr_flutter: ^4.1.0

  # --- Calendar, Datepickers & Scheduling ---
  add_2_calendar: ^3.0.1
  flutter_native_timezone_latest: ^1.0.0
  syncfusion_flutter_calendar: ^32.1.23
  table_calendar: ^3.2.0

  # --- Media, Camera, Files & Document Viewers ---
  file_picker: ^11.0.3
  flutter_image_compress: ^2.4.0
  image_cropper: ^12.2.1
  image_gallery_saver_plus: ^5.1.1
  image_picker: ^1.2.1
  media_kit: ^1.2.6
  mobile_scanner: ^7.1.3
  omni_video_player: ^4.0.0-beta
  open_filex: ^5.0.0
  syncfusion_flutter_pdfviewer: ^32.2.8
  webview_flutter: ^4.13.1
  youtube_player_flutter: ^9.1.3

  # --- Chat, Messaging & Text Rendering ---
  flutter_chat_types: ^3.6.2
  flutter_link_previewer: ^4.2.0
  flutter_linkify: ^6.0.0

  # --- System, Permissions, Push & Tracking ---
  app_tracking_transparency: ^2.0.6+1
  connectivity_plus: ^7.3.1
  onesignal_flutter: ^5.3.4
  package_info_plus: ^9.0.0
  permission_handler: ^13.0.2
  share_plus: ^12.0.1
  skills: ^0.1.0
  media_kit_libs_windows_video: ^1.0.11
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/CCF_Logo_Black.png"
  
  android: true

  ios: true

  web: true

  android_12:
    image: "assets/CCF_Logo_Black.png"
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/logo_dark.png
    - assets/logo_light.png
    - assets/logo_image.png
    - assets/landing_background.png
    - assets/image_placeholder.png
    - assets/DSC06378.jpg
    - assets/landing_v2.png
    - assets/landing_v2_blurred.png
    - assets/landing_v2_blurred_2.png